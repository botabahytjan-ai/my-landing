<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бизнеске арналған веб-сайт</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 40px 30px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
    h1 { font-size: 24px; font-weight: 700; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px; }
    p { font-size: 14px; color: #94a3b8; margin-bottom: 28px; line-height: 1.5; }
    .form-group { margin-bottom: 16px; }
    input { width: 100%; padding: 14px 16px; background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; border-radius: 10px; color: #fff; font-size: 15px; outline: none; transition: 0.3s; }
    input:focus { border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
    button { width: 100%; padding: 14px; background: linear-gradient(135deg, #a855f7, #6366f1); border: none; border-radius: 10px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
  </style>
</head>
<body>

  <div class="card">
    <h1>AI Арқылы Бизнесті Дамыту</h1>
    <p>Кеңес алу үшін атыңыз бен телефоныңызды қалдырыңыз:</p>

    <form id="tgForm">
      <div class="form-group">
        <input type="text" id="userName" placeholder="Сіздің атыңыз" required>
      </div>
      <div class="form-group">
        <input type="tel" id="userPhone" placeholder="Телефон нөміріңіз" required>
      </div>
      <button type="submit" id="submitBtn">Өтінім жіберу</button>
    </form>
  </div>

  <script>
    document.getElementById('tgForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      btn.innerText = 'Жіберілуде...';
      btn.disabled = true;

      const name = document.getElementById('userName').value;
      const phone = document.getElementById('userPhone').value;
      
      // Сіздің жаңа токеніңіз орнатылды
      const token = '8696946789:AAF2-DSJ-GxDBq0D2dpghq5x4jdfI5qxQDM';
      const chatId = '515087783';
      
      const text = `🔔 **Жаңа өтінім!**\n\n👤 **Аты:** ${name}\n📞 **Телефон:** ${phone}`;

      try {
        const response = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: chatId,
            text: text,
            parse_mode: 'Markdown'
          })
        });

        if (response.ok) {
          alert('Өтінішіңіз сәтті жіберілді!');
          document.getElementById('tgForm').reset();
        } else {
          alert('Қате пайда болды. Ботты тексеріңіз.');
        }
      } catch (error) {
        alert('Желілік қателік орын алды.');
      } finally {
        btn.innerText = 'Өтінім жіберу';
        btn.disabled = false;
      }
    });
  </script>

</body>
</html>
